# Procare to Baby Buddy importer.
#
# One container that stays up. It holds a socket open to Firebase and
# imports as soon as Procare says something happened, falling back to a
# poll every WATCH_POLL_MINUTES so nothing depends on a push arriving.
#
# Before deploying:
#   1. Copy the .py files to the Docker host, e.g. /opt/procare
#   2. Set PROCARE_DIR (and optionally the rest) in Portainer's "Environment variables" box when you deploy the stack.
#
# Logs:  docker logs -f procare-sync

services:
  procare-sync:
    image: python:3.14-slim
    container_name: procare-sync
    restart: unless-stopped

    environment:
      TZ: ${TZ:-America/New_York}
      PYTHONUNBUFFERED: "1"

      # Dependencies are installed once into the procare-deps volume.
      PYTHONPATH: /deps

      # Procare settings.
      PROCARE_EMAIL: ${PROCARE_EMAIL:-}
      PROCARE_PASSWORD: ${PROCARE_PASSWORD:-}
      PROCARE_TOKEN_CACHE: ${PROCARE_TOKEN_CACHE:-} # The token is cached beside the script by default so it survives this container being recreated.
      PROCARE_FCM_API_KEY: ${PROCARE_FCM_API_KEY:-} # Procare's own Firebase key, which registering for push needs. See the README.
      PROCARE_FCM_CACHE: ${PROCARE_FCM_CACHE:-} # As is the push device registration, which should be kept rather than repeated.
      PROCARE_KID_ID: ${PROCARE_KID_ID:-}
      PROCARE_VIDEO_DIR: ${PROCARE_VIDEO_DIR:-} # Videos are saved beside the script by default, on the same bind mount.

      # How long an activity can go unnoticed when no push arrives for it.
      WATCH_POLL_MINUTES: ${WATCH_POLL_MINUTES:-60}
      WATCH_SETTLE_SECONDS: ${WATCH_SETTLE_SECONDS:-30}

      # How much of the past each import re-reads. Dates pin the window instead: SYNC_START_DATE / SYNC_END_DATE.
      SYNC_DAYS_BACK: ${SYNC_DAYS_BACK:-1}
      SYNC_START_DATE: ${SYNC_START_DATE:-}
      SYNC_END_DATE: ${SYNC_END_DATE:-}

      # BabyBuddy settings.
      BABYBUDDY_URL: ${BABYBUDDY_URL:-}
      BABYBUDDY_TOKEN: ${BABYBUDDY_TOKEN:-}
      BABYBUDDY_CHILD_ID: ${BABYBUDDY_CHILD_ID:-}
      BABYBUDDY_TAG: ${BABYBUDDY_TAG:-daycare}
      BABYBUDDY_BOTTLE_TYPE: ${BABYBUDDY_BOTTLE_TYPE:-breast milk}
      MAX_NAP_HOURS: ${MAX_NAP_HOURS:-6}

    volumes:
      # Read-write: the session token, the push registration and the videos all live in here.
      - ${PROCARE_DIR:-/opt/procare}:/app
      - procare-deps:/deps

    # pip runs only on the first start after the volume is created; later
    # starts find the packages on PYTHONPATH and go straight to work.
    command:
      - sh
      - -c
      - |
        python -c 'import firebase_messaging' 2>/dev/null || pip install --quiet --no-cache-dir --target /deps requests firebase-messaging
        exec python /app/scripts/procare_watch.py


volumes:
  procare-deps:
